<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#161616">
  <title>opencode remote — sign in</title>
  <link rel="icon" href="data:,">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">
  <main class="login-wrap">
    <form id="login-form" class="login-card">
      <div class="brand brand-lg"><span class="brand-mark" aria-hidden="true"></span>opencode <span class="brand-dim">remote</span></div>
      <p class="sub">Enter the access code to continue.</p>
      <div class="pw-field">
        <input id="pw" type="text" class="masked" placeholder="Access code" aria-label="Access code"
               name="opencode-remote-access-code" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false" data-form-type="other"
               data-1p-ignore data-lpignore="true" data-bwignore autofocus>
        <button type="button" id="reveal" class="reveal" aria-label="Show access code" aria-pressed="false">Show</button>
      </div>
      <div id="login-error" class="login-error" hidden></div>
      <button type="submit" id="login-btn" class="btn primary block">Unlock</button>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
